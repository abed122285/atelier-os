  <style>
    /* @hallmark v2.0.0 | theme: maison-afaf-couture | genre: luxury-erp | floor: 0 FAIL | signature: haute-couture-atelier-workbench */
    /* critique: bespoke luxury fashion ERP pairing warm ivory & obsidian surfaces with metallic gold (#C99A3D) tokens, tabular DZD numerals, and GPU-composited motion */
    :root {
      --bg-canvas: #FAF8F3;
      --bg-surface: #FFFFFF;
      --bg-elevated: #F4F1EA;
      --text-primary: #20232B;
      --text-muted: #667085;
      --border-color: #E7E5E0;
      --brand-gold: #C99A3D;
      --brand-gold-light: #E7C879;
      --brand-gold-dark: #8C6425;
      --sidebar-bg: #101116;
      --radius-card: 12px;
      --radius-control: 8px;
    }
    html.dark {
      --bg-canvas: #101116;
      --bg-surface: #1C1D24;
      --bg-elevated: #252730;
      --text-primary: #F5F3EF;
      --text-muted: #98A2B3;
      --border-color: #2E303C;
    }
    *, ::before, ::after {
      box-sizing: border-box;
    }
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    html[dir="rtl"] body {
      font-family: 'IBM Plex Sans Arabic', 'Cairo', 'Inter', sans-serif;
    }
    html[dir="ltr"] body {
      font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
    }
    .surface-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: 0 1px 3px rgba(16, 17, 22, 0.04);
    }
    .surface-elevated {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-control);
    }
    .num-tabular {
      font-family: 'Inter', sans-serif;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      unicode-bidi: embed;
    }
    .btn-gold {
      background-color: #C99A3D;
      color: #101116;
      font-weight: 600;
      border-radius: var(--radius-control);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .btn-gold:hover {
      background-color: #d8a949;
    }
    .btn-gold:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid #C99A3D;
      outline-offset: 2px;
    }
    .sidebar-item-active {
      background: rgba(201, 154, 61, 0.15);
      color: #E7C879;
      border-inline-start: 3px solid #C99A3D;
    }
    .touch-target {
      min-height: 42px;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(102, 112, 133, 0.35); border-radius: 9999px; }

    /* Print styling for A4 & 80mm thermal invoice */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #invoice-print-container,
      #invoice-print-container * {
        visibility: visible !important;
      }
      #invoice-print-container {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        color: #101116 !important;
        box-shadow: none !important;
        border: none !important;
      }
      .no-print {
        display: none !important;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Offline / Sandbox Fallback Utility Layer (active before or without CDN) */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100vw; overflow-x: hidden; }
    img, svg, canvas { max-width: 100%; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .grid { display: grid; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .shrink-0 { flex-shrink: 0; }
    .min-w-0 { min-width: 0; }
    .w-full { width: 100%; }
    .w-4 { width: 1rem; } .h-4 { height: 1rem; }
    .w-5 { width: 1.25rem; } .h-5 { height: 1.25rem; }
    .w-6 { width: 1.5rem; } .h-6 { height: 1.5rem; }
    .w-8 { width: 2rem; } .h-8 { height: 2rem; }
    .w-10 { width: 2.5rem; } .h-10 { height: 2.5rem; }
    .w-12 { width: 3rem; } .h-12 { height: 3rem; }
    .w-64 { width: 16rem; }
    .fixed { position: fixed; }
    .sticky { position: sticky; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .inset-x-0 { left: 0; right: 0; }
    .top-0 { top: 0; } .bottom-0 { bottom: 0; }
    .overflow-hidden { overflow: hidden; }
    .overflow-x-auto { overflow-x: auto; }
    .overflow-y-auto { overflow-y: auto; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 1023px) {
      #app-sidebar.-translate-x-full, #app-sidebar.translate-x-full { display: none; }
      #app-sidebar.mobile-open { display: flex !important; position: fixed; top: 0; bottom: 0; z-index: 40; }
    }
    @media (min-width: 768px) {
      .md\:block { display: block !important; }
      .md\:hidden { display: none !important; }
      .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .md\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .lg\:hidden { display: none !important; }
      .lg\:flex { display: flex !important; }
      .lg\:block { display: block !important; }
      .lg\:sticky { position: sticky !important; display: flex !important; transform: none !important; }
      .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .lg\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }


    /* Hallmark Floor & React Bits / GSAP Coordinated Motion Layer */
    html, body { overflow-x: clip; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="button"]:focus-visible {
      outline: 2px solid var(--brand-gold) !important;
      outline-offset: 2px !important;
    }
    .rb-spotlight-card {
      position: relative;
      overflow: hidden;
    }
    .rb-spotlight-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: var(--spot-opacity, 0);
      transition: opacity 280ms ease;
      background: radial-gradient(340px circle at var(--spot-x, 50%) var(--spot-y, 50%), rgba(201, 154, 61, 0.13), transparent 70%);
      z-index: 0;
    }
    .rb-spotlight-card > * {
      position: relative;
      z-index: 1;
    }
    @keyframes atelierStageReveal {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .atelier-stage-enter {
      animation: atelierStageReveal 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .rb-spotlight-card::before {
        display: none !important;
      }
    }

  </style>

      function getAlgiersDateIso(dateObj) {
        var d = dateObj || new Date();
        try {
          var parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Africa/Algiers",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).formatToParts(d);
          var y = "", m = "", day = "";
          for (var i = 0; i < parts.length; i++) {
            if (parts[i].type === "year") y = parts[i].value;
            if (parts[i].type === "month") m = parts[i].value;
            if (parts[i].type === "day") day = parts[i].value;
          }
          if (y && m && day) return y + "-" + m + "-" + day;
        } catch (e) {}
        return d.toISOString().slice(0, 10);
      }

      var STORAGE_KEY = "ATELIER_OS_AFAF_EL_ASSLI_DB_V1_1";
      var db = null;

      function loadDatabase() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.materials && parsed.invoices) {
              db = parsed;
              db.settings.logoUrl = getAssetSrc("asset-logo") || db.settings.logoUrl;
              return;
            }
          }
        } catch (e) {}
        db = buildInitialDatabase();
        saveDatabase();
      }

      function saveDatabase() {
        recalculateAllDerivedStates();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        } catch (e) {}
      }

      function computeInvoicePaymentStatus(inv) {
        var todayIso = getAlgiersDateIso();
        var total = roundMoney(inv.totalAmount);
        var paid = 0;
        var refunded = 0;
        for (var i = 0; i < db.payments.length; i++) {
          if (db.payments[i].invoiceId === inv.id) {
            paid += roundMoney(db.payments[i].amount);
          }
        }
        for (var j = 0; j < db.refunds.length; j++) {
          if (db.refunds[j].invoiceId === inv.id) {
            refunded += roundMoney(db.refunds[j].amount);
          }
        }
        paid = roundMoney(paid);
        refunded = roundMoney(refunded);
        var netPaid = roundMoney(Math.max(0, paid - refunded));
        var remaining = roundMoney(Math.max(0, total - netPaid));

        inv.paidAmount = paid;
        inv.refundedAmount = refunded;
        inv.netPaidAmount = netPaid;
        inv.remainingBalance = remaining;

        if (refunded > 0 && netPaid === 0 && paid > 0) {
          inv.paymentStatus = "REFUNDED";
          inv.remainingBalance = 0;
        } else if (refunded > 0 && netPaid > 0) {
          inv.paymentStatus = "PARTIALLY_REFUNDED";
        } else if (remaining === 0 && total > 0) {
          inv.paymentStatus = "PAID";
        } else if (remaining > 0 && inv.dueDate && inv.dueDate < todayIso) {
          inv.paymentStatus = "OVERDUE";
        } else if (netPaid > 0 && remaining > 0) {
          inv.paymentStatus = "PARTIALLY_PAID";
        } else {
          inv.paymentStatus = "UNPAID";
        }
      }

      function recalculateAllDerivedStates() {
        if (!db) return;
        for (var i = 0; i < db.materials.length; i++) {
          var m = db.materials[i];
          m.onHandQty = roundQty(Math.max(0, m.onHandQty));
          m.reservedQty = roundQty(Math.max(0, m.reservedQty));
          m.availableQty = roundQty(Math.max(0, m.onHandQty - m.reservedQty));
        }
        for (var j = 0; j < db.finishedProducts.length; j++) {
          var fp = db.finishedProducts[j];
          fp.onHandQty = Math.max(0, Math.round(fp.onHandQty));
          fp.reservedQty = Math.max(0, Math.round(fp.reservedQty || 0));
          fp.availableQty = Math.max(0, fp.onHandQty - fp.reservedQty);
          if (fp.availableQty <= 0) fp.status = "OUT_OF_STOCK";
          else if (fp.availableQty <= (fp.minStockThreshold || 2)) fp.status = "LOW_STOCK";
          else fp.status = "AVAILABLE";
        }
        for (var k = 0; k < db.invoices.length; k++) {
          computeInvoicePaymentStatus(db.invoices[k]);
        }
        for (var c = 0; c < db.customers.length; c++) {
          var cust = db.customers[c];
          var totPur = 0, totPaid = 0, totRem = 0;
          for (var invIdx = 0; invIdx < db.invoices.length; invIdx++) {
            var inv = db.invoices[invIdx];
            if (inv.customerId === cust.id && inv.documentStatus !== "CANCELLED") {
              totPur += roundMoney(inv.totalAmount - inv.refundedAmount);
              totPaid += roundMoney(inv.netPaidAmount);
              totRem += roundMoney(inv.remainingBalance);
            }
          }
          cust.totalPurchases = roundMoney(totPur);
          cust.totalPaid = roundMoney(totPaid);
          cust.outstandingBalance = roundMoney(totRem);
        }
        for (var s = 0; s < db.suppliers.length; s++) {
          var sup = db.suppliers[s];
          var sPur = 0, sPaid = 0;
          for (var pIdx = 0; pIdx < db.purchases.length; pIdx++) {
            var pur = db.purchases[pIdx];
            if (pur.supplierId === sup.id && pur.receiptStatus !== "CANCELLED") {
              sPur += roundMoney(pur.totalAmount);
            }
          }
          for (var spIdx = 0; spIdx < db.supplierPayments.length; spIdx++) {
            var sp = db.supplierPayments[spIdx];
            if (sp.supplierId === sup.id) {
              sPaid += roundMoney(sp.amount);
            }
          }
          sup.totalPurchases = roundMoney(sPur);
          sup.totalPaid = roundMoney(sPaid);
          sup.outstandingBalance = roundMoney(Math.max(0, sPur - sPaid));
        }
      }

      function calcMovingAverageCost(oldQty, oldAvg, addQty, addUnitCost) {
        if (addQty <= 0) return roundMoney(oldAvg);
        var safeOld = Math.max(0, oldQty);
        var totalVal = safeOld * oldAvg + addQty * addUnitCost;
        var newQty = safeOld + addQty;
        return newQty > 0 ? roundMoney(totalVal / newQty) : roundMoney(addUnitCost);
      }

      function recordCashMovement(direction, category, amount, paymentMethod, refType, refId, description, dateStr) {
        var todayIso = getAlgiersDateIso();
        var lastBal = db.cashMovements.length > 0 ? roundMoney(db.cashMovements[db.cashMovements.length - 1].balanceAfter) : 0;
        var delta = direction === "IN" ? roundMoney(amount) : -roundMoney(amount);
        var nextBal = roundMoney(lastBal + delta);
        db.cashMovements.push({
          id: uid("cm"),
          movementReference: "CAI-2026-" + String(db.cashMovements.length + 10).padStart(3, "0"),
          direction: direction,
          category: category,
          amount: roundMoney(amount),
          paymentMethod: paymentMethod || "CASH",
          balanceAfter: nextBal,
          referenceType: refType,
          referenceId: refId,
          description: description,
          movementDate: dateStr || todayIso
        });
      }

      function logActivity(actionType, entityType, entityId, summaryAr, summaryFr) {
        var todayIso = getAlgiersDateIso();
        db.activityLogs.unshift({
          id: uid("log"),
          actionType: actionType,
          entityType: entityType,
          entityId: entityId,
          summaryAr: summaryAr,
          summaryFr: summaryFr,
          createdAt: todayIso + " " + new Date().toTimeString().slice(0, 5)
        });
      }

      function matchesPeriod(dateStr, period) {
        if (!period || period === "ALL" || !dateStr) return true;
        var todayIso = getAlgiersDateIso();
        var d = String(dateStr).slice(0, 10);
        if (period === "TODAY") return d === todayIso;
        if (period === "WEEK") {
          var weekAgo = addDaysIso(todayIso, -7);
          return d >= weekAgo && d <= todayIso;
        }
        if (period === "MONTH") {
          return d.slice(0, 7) === todayIso.slice(0, 7);
        }
        return true;
      }

      function computeFinancialSummary(periodFilter) {
        var grossSales = 0, totalRefunds = 0, totalCogs = 0, salesCount = 0;

        for (var i = 0; i < db.sales.length; i++) {
          var s = db.sales[i];
          if (s.status === "CANCELLED") continue;
          if (!matchesPeriod(s.saleDate, periodFilter)) continue;
          grossSales += roundMoney(s.totalAmount);
          totalCogs += roundMoney(s.totalCogs);
          salesCount++;
        }

        for (var r = 0; r < db.refunds.length; r++) {
          var rf = db.refunds[r];
          if (!matchesPeriod(rf.refundDate, periodFilter)) continue;
          totalRefunds += roundMoney(rf.amount);
        }

        var netRevenue = roundMoney(Math.max(0, grossSales - totalRefunds));
        var grossProfit = roundMoney(netRevenue - totalCogs);

        var operatingExpenses = 0;
        for (var e = 0; e < db.expenses.length; e++) {
          if (!matchesPeriod(db.expenses[e].expenseDate, periodFilter)) continue;
          operatingExpenses += roundMoney(db.expenses[e].amount);
        }
        operatingExpenses = roundMoney(operatingExpenses);

        var netProfit = roundMoney(grossProfit - operatingExpenses);

        var cashCollected = 0;
        for (var p = 0; p < db.payments.length; p++) {
          if (!matchesPeriod(db.payments[p].paymentDate, periodFilter)) continue;
          cashCollected += roundMoney(db.payments[p].amount);
        }
        cashCollected = roundMoney(Math.max(0, cashCollected - totalRefunds));

        var totalReceivables = 0;
        for (var invIdx = 0; invIdx < db.invoices.length; invIdx++) {
          var inv = db.invoices[invIdx];
          if (inv.documentStatus !== "CANCELLED") {
            totalReceivables += roundMoney(inv.remainingBalance);
          }
        }

        var supplierLiabilities = 0;
        for (var supIdx = 0; supIdx < db.suppliers.length; supIdx++) {
          supplierLiabilities += roundMoney(db.suppliers[supIdx].outstandingBalance);
        }

        var rawStockValue = 0;
        for (var mIdx = 0; mIdx < db.materials.length; mIdx++) {
          rawStockValue += roundMoney(db.materials[mIdx].onHandQty * db.materials[mIdx].averageCost);
        }

        var finishedStockQty = 0, finishedStockCostValue = 0, finishedStockRetailValue = 0;
        for (var fIdx = 0; fIdx < db.finishedProducts.length; fIdx++) {
          var fp = db.finishedProducts[fIdx];
          finishedStockQty += fp.onHandQty;
          finishedStockCostValue += roundMoney(fp.onHandQty * fp.unitProductionCost);
          finishedStockRetailValue += roundMoney(fp.onHandQty * fp.sellingPrice);
        }

        var activeProductionCount = 0;
        for (var poIdx = 0; poIdx < db.productionOrders.length; poIdx++) {
          var st = db.productionOrders[poIdx].status;
          if (st !== "COMPLETED" && st !== "CANCELLED") activeProductionCount++;
        }

        var caisseBalance = db.cashMovements.length > 0
          ? roundMoney(db.cashMovements[db.cashMovements.length - 1].balanceAfter)
          : 0;

        return {
          grossSales: roundMoney(grossSales),
          totalRefunds: roundMoney(totalRefunds),
          netRevenue: netRevenue,
          totalCogs: roundMoney(totalCogs),
          grossProfit: grossProfit,
          operatingExpenses: operatingExpenses,
          netProfit: netProfit,
          salesCount: salesCount,
          cashCollected: cashCollected,
          totalReceivables: roundMoney(totalReceivables),
          supplierLiabilities: roundMoney(supplierLiabilities),
          rawStockValue: roundMoney(rawStockValue),
          finishedStockQty: finishedStockQty,
          finishedStockCostValue: roundMoney(finishedStockCostValue),
          finishedStockRetailValue: roundMoney(finishedStockRetailValue),
          activeProductionCount: activeProductionCount,
          caisseBalance: caisseBalance
        };
      }

      /**
       * Dynamically aggregates chart series from actual database records (db.sales, db.expenses, db.categories)
       * so charts update immediately when any sale, return, or expense is recorded.
       */
      function computeDynamicChartSeries() {
        var bucketMap = {};
        for (var i = 0; i < db.sales.length; i++) {
          var s = db.sales[i];
          if (s.status === "CANCELLED") continue;
          var dKey = String(s.saleDate).slice(0, 10);
          if (!bucketMap[dKey]) bucketMap[dKey] = { rev: 0, cogs: 0, exp: 0 };
          bucketMap[dKey].rev += roundMoney(s.totalAmount);
          bucketMap[dKey].cogs += roundMoney(s.totalCogs);
        }
        for (var r = 0; r < db.refunds.length; r++) {
          var rf = db.refunds[r];
          var rKey = String(rf.refundDate).slice(0, 10);
          if (!bucketMap[rKey]) bucketMap[rKey] = { rev: 0, cogs: 0, exp: 0 };
          bucketMap[rKey].rev = roundMoney(Math.max(0, bucketMap[rKey].rev - rf.amount));
        }
        for (var e = 0; e < db.expenses.length; e++) {
          var ex = db.expenses[e];
          var eKey = String(ex.expenseDate).slice(0, 10);
          if (!bucketMap[eKey]) bucketMap[eKey] = { rev: 0, cogs: 0, exp: 0 };
          bucketMap[eKey].exp += roundMoney(ex.amount);
        }
        var dates = Object.keys(bucketMap).sort();
        var revSeries = [], cogsSeries = [], netSeries = [];
        for (var k = 0; k < dates.length; k++) {
          var b = bucketMap[dates[k]];
          revSeries.push(roundMoney(b.rev));
          cogsSeries.push(roundMoney(b.cogs));
          netSeries.push(roundMoney(b.rev - b.cogs - b.exp));
        }

        // Category breakdown from actual sale items
        var catTotals = {};
        var prodCats = db.categories.filter(function(c) { return c.domain === "PRODUCT"; });
        for (var cIdx = 0; cIdx < prodCats.length; cIdx++) {
          catTotals[prodCats[cIdx].id] = 0;
        }
        for (var sIdx = 0; sIdx < db.sales.length; sIdx++) {
          var sale = db.sales[sIdx];
          if (sale.status === "CANCELLED") continue;
          for (var it = 0; it < (sale.items || []).length; it++) {
            var item = sale.items[it];
            var fp = db.finishedProducts.find(function(x) { return x.id === item.finishedProductId; });
            var catId = fp ? fp.categoryId : "cat-p-aby";
            var netLine = roundMoney(Math.max(0, item.quantity - (item.returnedQty || 0)) * item.unitPrice - (item.lineDiscount || 0));
            catTotals[catId] = roundMoney((catTotals[catId] || 0) + netLine);
          }
        }
        var catLabels = [], catData = [];
        for (var pc = 0; pc < prodCats.length; pc++) {
          catLabels.push(bi(prodCats[pc].nameAr, prodCats[pc].nameFr));
          catData.push(catTotals[prodCats[pc].id] || 0);
        }

        return {
          dates: dates,
          revSeries: revSeries,
          cogsSeries: cogsSeries,
          netSeries: netSeries,
          catLabels: catLabels,
          catData: catData
        };
      }

      // =========================================================================
      function calcModelBomCost(model) {
        var total = 0;
        if (!model.bomItems) return 0;
        for (var i = 0; i < model.bomItems.length; i++) {
          var item = model.bomItems[i];
          var mat = db.materials.find(function(m) { return m.id === item.materialId; });
          if (mat) {
            var effQty = item.quantityPerUnit * (1 + (item.wastagePercent || 0) / 100);
            total += effQty * mat.averageCost;
          }
        }
        return roundMoney(total);
      }

      // =========================================================================
      // 13. MODULE 07 — SALES & POINT OF SALE (Specialized Mobile & Desktop POS)
      // =========================================================================
      function renderPosModule(container) {
        var prdCats = db.categories.filter(function(c) { return c.domain === "PRODUCT"; });
        var filteredProds = db.finishedProducts.filter(function(p) {
          var q = (uiState.posSearch || "").toLowerCase();
          var matchQ = !q || p.sku.toLowerCase().indexOf(q) !== -1 || (p.barcode && p.barcode.indexOf(q) !== -1) || p.nameAr.toLowerCase().indexOf(q) !== -1 || p.nameFr.toLowerCase().indexOf(q) !== -1;
          var matchC = uiState.posCategoryFilter === "ALL" || p.categoryId === uiState.posCategoryFilter;
          return matchQ && matchC;
        });

        var subtotal = 0, lineDiscountTotal = 0, totalItemsCount = 0;
        for (var i = 0; i < uiState.posCart.length; i++) {
          var ci = uiState.posCart[i];
          totalItemsCount += ci.quantity;
          var fp = db.finishedProducts.find(function(x) { return x.id === ci.finishedProductId; });
          if (fp) {
            subtotal += roundMoney(fp.sellingPrice * ci.quantity);
            lineDiscountTotal += roundMoney(ci.lineDiscount || 0);
          }
        }
        var orderDisc = roundMoney(uiState.posOrderDiscount || 0);
        var netBeforeTax = roundMoney(Math.max(0, subtotal - lineDiscountTotal - orderDisc));
        var taxAmt = db.settings.taxEnabled ? roundMoney(netBeforeTax * (db.settings.defaultTaxRate / 100)) : 0;

            reader.onload = function(ev) {
              try {
                var imported = JSON.parse(ev.target.result);
                if (!imported || !imported.materials || !imported.invoices) {
                  showToast("ملف النسخة الاحتياطية غير صالح", "Fichier de sauvegarde invalide", "error");

              }
            };
            reader.readAsText(file);
          });
        }
      }

      // --- Stock Adjustment Modal ---
      function openStockAdjustmentModal(preselectedMatId) {
        var html = '<form id="modal-form-stock-adj" class="space-y-3.5 text-xs">';
        html += '<div><label class="block mb-1 font-semibold">' + esc(bi("اختر المادة الأولية *", "Sélectionner la Matière *")) + '</label><select name="materialId" class="w-full px-3 py-2 rounded-lg surface-elevated min-h-[40px]">';

          html += '<option value="' + m.id + '" ' + sel + '>' + esc(bi(m.nameAr, m.nameFr)) + ' (' + esc(m.sku) + ' — ' + fmtQty(m.availableQty, m.unit) + ')</option>';
        }
        html += '</select></div>';
        html += '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">';
        html += '  <div><label class="block mb-1 font-semibold">' + esc(bi("نوع التسوية *", "Sens de l'Ajustement *")) + '</label><select name="direction" class="w-full px-3 py-2 rounded-lg surface-elevated min-h-[40px]"><option value="IN">' + esc(bi("زيادة المخزون (+ IN)", "Entrée / Gain d'inventaire (+ IN)")) + '</option><option value="OUT">' + esc(bi("تخفيض / تلف (- OUT)", "Sortie / Perte d'inventaire (- OUT)")) + '</option></select></div>';
        html += '  <div><label class="block mb-1 font-semibold">' + esc(bi("الكمية *", "Quantité *")) + '</label><input type="number" name="quantity" min="0.1" step="0.1" value="1" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular min-h-[40px]" required /></div>';
        html += '</div>';
        html += '<div><label class="block mb-1 font-semibold">' + esc(bi("السبب الإلزامي للتسوية *", "Motif Obligatoire de l'Ajustement *")) + '</label><input type="text" name="reason" placeholder="' + esc(bi("مثال: جرد دوري أو تلف طرف القماش...", "Ex: Inventaire physique ou perte coupe...")) + '" class="w-full px-3 py-2 rounded-lg surface-elevated min-h-[40px]" required minlength="3" /></div>';
        html += '<div class="flex justify-end gap-2 pt-3 border-t border-[var(--border-color)]"><button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg surface-elevated min-h-[40px]">' + esc(bi("إلغاء", "Annuler")) + '</button><button type="submit" class="btn-gold px-5 py-2 rounded-lg font-bold min-h-[40px] flex items-center gap-1.5">' + lucideIcon("CheckCircle2", "w-4 h-4") + '<span>' + esc(bi("اعتماد حركة التسوية", "Valider l'Ajustement")) + '</span></button></div>';
        html += '</form>';

        openModal("تسوية مخزون موثقة (دفتر الحركات)", "Ajustement de Stock Traçable", html);
        var form = document.getElementById("modal-form-stock-adj");
        if (form) {
          form.addEventListener("submit", function(e) {
            e.preventDefault();
            var fd = new FormData(form);
            var mat = db.materials.find(function(x) { return x.id === fd.get("materialId"); });
            var dir = String(fd.get("direction"));
            var qty = roundQty(parseFloat(fd.get("quantity")) || 0);
            var reason = String(fd.get("reason") || "").trim();
            if (!mat || qty <= 0 || reason.length < 3) return;
            if (dir === "OUT" && db.settings.preventNegativeStock && qty > mat.availableQty) {
              showToast("لا يمكن خصم كمية أكبر من المتاح (" + mat.availableQty + " " + mat.unit + ")", "Quantité supérieure au stock disponible", "error");
              return;
            }
            var idemKey = uid("idem-adj");
            mat.onHandQty = dir === "IN" ? roundQty(mat.onHandQty + qty) : roundQty(mat.onHandQty - qty);
            mat.availableQty = roundQty(Math.max(0, mat.onHandQty - mat.reservedQty));
            db.materialStockMovements.push({
              id: uid("msm"),
              idempotencyKey: idemKey,
              materialId: mat.id,
              movementType: dir === "IN" ? "ADJUSTMENT_IN" : "ADJUSTMENT_OUT",
              direction: dir,
              quantity: qty,
              unitCost: mat.averageCost,
              totalCost: roundMoney(qty * mat.averageCost),
              balanceAfterOnHand: mat.onHandQty,
              balanceAfterAvailable: mat.availableQty,
              referenceType: "MANUAL_ADJUSTMENT",
              referenceId: "ADJ-" + Date.now().toString().slice(-5),
              reason: reason,
              createdAt: getAlgiersDateIso() + " 14:00"
            });
            syncBackendMutation("ADJUST_MATERIAL_STOCK", {
              idempotencyKey: idemKey,
              materialId: mat.id,
              direction: dir,
              quantity: qty,
              reason: reason
            });
            saveDatabase();
            closeModal();
            renderApp();
            showToast("تم تسجيل تسوية المخزون في دفتر الحركات", "Ajustement enregistré dans le grand-livre de stock", "success");
          });
        }
      }

        html += '<div><label class="block mb-1 font-semibold">' + esc(bi("ملاحظات التوريد", "Notes")) + '</label><input type="text" name="notes" placeholder="توريد واستلام فوري للمخزن" class="w-full px-3 py-2 rounded-lg surface-elevated min-h-[40px]" /></div>';
        html += '<div class="flex justify-end gap-2 pt-3 border-t border-[var(--border-color)]"><button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg surface-elevated min-h-[40px]">' + esc(bi("إلغاء", "Annuler")) + '</button><button type="submit" class="btn-gold px-5 py-2 rounded-lg font-bold min-h-[40px] flex items-center gap-1.5">' + lucideIcon("CheckCircle2", "w-4 h-4") + '<span>' + esc(bi("تأكيد الشراء واستلام المخزون", "Valider l'Achat & Réceptionner")) + '</span></button></div>';
        html += '</form>';

        openModal("تسجيل عملية شراء واستلام مواد أولية", "Nouvel Achat & Réception Matière", html);
        var form = document.getElementById("modal-form-add-purchase");
        if (form) {
          form.addEventListener("submit", function(e) {
            e.preventDefault();
            var fd = new FormData(form);
            var supId = String(fd.get("supplierId"));
            var matId = String(fd.get("materialId"));
            var qty = roundQty(parseFloat(fd.get("quantity")) || 0);
            var uPrice = roundMoney(parseFloat(fd.get("unitPrice")) || 0);
            var total = roundMoney(qty * uPrice);
            var paid = roundMoney(Math.min(total, Math.max(0, parseFloat(fd.get("paidAmount")) || 0)));
            var rem = roundMoney(total - paid);
            var pm = String(fd.get("paymentMethod") || "CASH");
            var todayIso = getAlgiersDateIso();

            var mat = db.materials.find(function(x) { return x.id === matId; });
            if (!mat || qty <= 0) return;

            var purNum = "ACH-2026-" + String(db.purchases.length + 101).padStart(3, "0");
            var newPurId = uid("pur");
            var idemKey = uid("idem-pur");

            var newCmp = calcMovingAverageCost(mat.onHandQty, mat.averageCost, qty, uPrice);
            mat.onHandQty = roundQty(mat.onHandQty + qty);
            mat.availableQty = roundQty(Math.max(0, mat.onHandQty - mat.reservedQty));
            mat.averageCost = newCmp;
            mat.lastPurchaseCost = uPrice;

            db.purchases.unshift({
              id: newPurId,
              idempotencyKey: idemKey,
              purchaseNumber: purNum,
              supplierId: supId,
              purchaseDate: todayIso,
              dueDate: addDaysIso(todayIso, 30),
              receiptStatus: "RECEIVED",
              paymentStatus: rem === 0 ? "PAID" : (paid > 0 ? "PARTIALLY_PAID" : "UNPAID"),
              subtotal: total,
              shippingCost: 0,
              discountAmount: 0,
              totalAmount: total,
              paidAmount: paid,
              remainingAmount: rem,
              paymentMethod: pm,
              notes: String(fd.get("notes") || ""),
              items: [{ materialId: matId, orderedQty: qty, receivedQty: qty, unitPrice: uPrice, lineTotal: total }]
            });

            db.materialStockMovements.push({
              id: uid("msm"),
              idempotencyKey: "pur-rec-" + newPurId,
              materialId: matId,
              movementType: "PURCHASE_RECEIPT",
              direction: "IN",
              quantity: qty,
              unitCost: uPrice,
              totalCost: total,
              balanceAfterOnHand: mat.onHandQty,
              balanceAfterAvailable: mat.availableQty,
              referenceType: "PURCHASE",
              referenceId: purNum,
              reason: "استلام مشتريات " + purNum + " (CMP جديد: " + newCmp + " د.ج)",
              createdAt: todayIso + " 15:00"
            });

            if (paid > 0) {
              var spRef = "REG-FOUR-" + String(db.supplierPayments.length + 105);
              db.supplierPayments.push({
                id: uid("sp"),
                paymentReference: spRef,
                supplierId: supId,
                purchaseId: newPurId,
                amount: paid,
                paymentMethod: pm,
                paymentDate: todayIso,
                notes: "دفعة عند استلام الشراء " + purNum
              });
              recordCashMovement("OUT", "SUPPLIER_PAYMENT", paid, pm, "SUPPLIER_PAYMENT", spRef, "تسديد مورد — " + purNum, todayIso);
            }

            syncBackendMutation("CREATE_AND_RECEIVE_PURCHASE", {
              idempotencyKey: idemKey,
              supplierId: supId,
              paidAmount: paid,
              paymentMethod: pm,
              items: [{ materialId: matId, orderedQty: qty, receivedQty: qty, unitPrice: uPrice }]
            });

            saveDatabase();
            closeModal();
            renderApp();
            showToast("تم استلام الشراء " + purNum + " وزيادة المخزون وتحديث التكلفة المرجحة CMP", "Achat " + purNum + " réceptionné et CMP mis à jour", "success");
          });
        }
      }

        html += '<div class="flex justify-end gap-2 pt-3 border-t border-[var(--border-color)]"><button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg surface-elevated min-h-[40px]">' + esc(bi("إلغاء", "Annuler")) + '</button><button type="submit" class="btn-gold px-5 py-2 rounded-lg font-bold min-h-[40px]">' + esc(bi("اعتماد أمر الإنتاج وحجز المواد", "Créer l'Ordre & Réserver les Matières")) + '</button></div>';
        html += '</form>';

        openModal("إنشاء أمر إنتاج جديد وحجز المواد (BOM)", "Nouvel Ordre de Production & Réservation BOM", html);
        var form = document.getElementById("modal-form-add-po");
        if (form) {
          form.addEventListener("submit", function(e) {
            e.preventDefault();
            var fd = new FormData(form);
            var mdl = db.models.find(function(x) { return x.id === fd.get("modelId"); });
            var reqQty = Math.max(1, parseInt(fd.get("requestedQty"), 10) || 1);
            if (!mdl) return;

            for (var b = 0; b < (mdl.bomItems || []).length; b++) {
              var bItem = mdl.bomItems[b];
              var mat = db.materials.find(function(x) { return x.id === bItem.materialId; });
              var needed = roundQty(bItem.quantityPerUnit * reqQty);
              if (mat && db.settings.preventNegativeStock && needed > mat.availableQty) {
                showToast("الكمية المتاحة غير كافية من " + bi(mat.nameAr, mat.nameFr) + " (المطلوب: " + needed + "، المتاح: " + mat.availableQty + ")", "Stock disponible insuffisant pour " + mat.nameFr, "error");
                return;
              }
            }

            var ordNum = "OF-2026-" + String(db.productionOrders.length + 101);
            var newPoId = uid("po");
            for (var r = 0; r < (mdl.bomItems || []).length; r++) {
              var rItem = mdl.bomItems[r];
              var rMat = db.materials.find(function(x) { return x.id === rItem.materialId; });
              var resQ = roundQty(rItem.quantityPerUnit * reqQty);
              if (rMat) {
                rMat.reservedQty = roundQty(rMat.reservedQty + resQ);
                rMat.availableQty = roundQty(Math.max(0, rMat.onHandQty - rMat.reservedQty));
                db.materialStockMovements.push({
                  id: uid("msm"),
                  idempotencyKey: "res-" + newPoId + "-" + rMat.id,
                  materialId: rMat.id,
                  movementType: "PRODUCTION_RESERVE",
                  direction: "RESERVE",
                  quantity: resQ,
                  unitCost: rMat.averageCost,
                  totalCost: roundMoney(resQ * rMat.averageCost),
                  balanceAfterOnHand: rMat.onHandQty,
                  balanceAfterAvailable: rMat.availableQty,
                  referenceType: "PRODUCTION_ORDER",
                  referenceId: ordNum,
                  reason: "حجز مواد لأمر الإنتاج " + ordNum,
                  createdAt: todayIso + " 15:10"
                });
              }
            }

            var estMatCost = roundMoney(calcModelBomCost(mdl) * reqQty);
            db.productionOrders.unshift({
              id: newPoId,
              idempotencyKey: uid("idem-po"),
              orderNumber: ordNum,
              modelId: mdl.id,
              color: String(fd.get("color") || "Noir"),
              size: String(fd.get("size") || "M"),
              requestedQty: reqQty,
              producedQty: 0,
              acceptedQty: 0,
              rejectedQty: 0,
              currentStageCode: "CUTTING",
              status: "IN_PROGRESS",
              materialsReserved: true,
              materialsIssued: false,
              stockCompleted: false,
              plannedStartDate: String(fd.get("plannedStartDate")),
              expectedCompletionDate: String(fd.get("expectedCompletionDate")),
              completedAt: null,
              estimatedMaterialCost: estMatCost,
              actualMaterialCost: 0,
              directLaborCost: roundMoney((mdl.estimatedLaborCost || 2500) * reqQty),
              actualTotalCost: 0,
              actualUnitCost: 0,
              assignedNotes: String(fd.get("assignedNotes") || "")
            });

            saveDatabase();
            closeModal();
            renderApp();
            showToast("تم إنشاء أمر الإنتاج " + ordNum + " وحجز المواد الأولية بنجاح", "Ordre " + ordNum + " créé et matières réservées", "success");
          });
        }
      }

      function advanceProductionStage(poId) {
        var po = db.productionOrders.find(function(x) { return x.id === poId; });
        if (!po || po.status === "COMPLETED" || po.status === "CANCELLED") return;
        var orderSeq = ["PLANNED", "WAITING_MATERIALS", "CUTTING", "SEWING", "EMBROIDERY", "FINISHING", "QUALITY_CONTROL"];
        var idx = orderSeq.indexOf(po.currentStageCode);
        if (idx >= 0 && idx < orderSeq.length - 1) {
          po.currentStageCode = orderSeq[idx + 1];
          po.status = "IN_PROGRESS";
          saveDatabase();
          renderApp();
          showToast("انتقل الأمر " + po.orderNumber + " إلى مرحلة: " + t("stage_" + po.currentStageCode), "Ordre " + po.orderNumber + " avancé vers : " + t("stage_" + po.currentStageCode), "success");
        } else {
          openCompleteProductionModal(poId);
        }
      }

      function cancelProductionOrder(poId) {
        var po = db.productionOrders.find(function(x) { return x.id === poId; });
        if (!po || po.status === "COMPLETED" || po.status === "CANCELLED") return;
        var mdl = db.models.find(function(m) { return m.id === po.modelId; });
        if (po.materialsReserved && mdl && mdl.bomItems) {
          for (var i = 0; i < mdl.bomItems.length; i++) {
            var b = mdl.bomItems[i];
            var mat = db.materials.find(function(x) { return x.id === b.materialId; });
            var relQ = roundQty(b.quantityPerUnit * po.requestedQty);
            if (mat) {
              mat.reservedQty = roundQty(Math.max(0, mat.reservedQty - relQ));
              mat.availableQty = roundQty(Math.max(0, mat.onHandQty - mat.reservedQty));
            }
          }
          po.materialsReserved = false;
        }
        po.status = "CANCELLED";
        po.currentStageCode = "CANCELLED";
        saveDatabase();
        renderApp();
        showToast("تم إلغاء أمر الإنتاج " + po.orderNumber + " وتحرير المواد المحجوزة", "Ordre " + po.orderNumber + " annulé et réservations libérées", "warning");
      }

      function openCompleteProductionModal(poId) {
        var po = db.productionOrders.find(function(x) { return x.id === poId; });
        if (!po || po.stockCompleted) return;
        var mdl = db.models.find(function(m) { return m.id === po.modelId; });

        var html = '<form id="modal-form-complete-po" class="space-y-3.5 text-xs">';
        html += '<div class="p-3 rounded-xl surface-elevated flex items-center justify-between"><div><div class="font-bold text-sm">' + esc(po.orderNumber) + ' — ' + esc(mdl ? bi(mdl.nameAr, mdl.nameFr) : "") + '</div><div class="text-[11px] text-[var(--text-muted)]">' + esc(po.color) + ' / ' + esc(po.size) + ' • ' + esc(bi("الكمية المطلوبة: ", "Qté demandée : ")) + po.requestedQty + '</div></div></div>';
        html += '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">';
        html += '  <div><label class="block mb-1 font-semibold">' + esc(bi("الكمية المنتجة فعلياً *", "Qté Produite *")) + '</label><input type="number" name="producedQty" min="1" value="' + po.requestedQty + '" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular font-bold min-h-[40px]" required /></div>';
        html += '  <div><label class="block mb-1 font-semibold text-emerald-500">' + esc(bi("الكمية المقبولة (تدخل المخزون) *", "Qté Acceptée QC *")) + '</label><input type="number" name="acceptedQty" min="1" value="' + po.requestedQty + '" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular font-bold text-emerald-500 min-h-[40px]" required /></div>';
        html += '  <div><label class="block mb-1 font-semibold text-red-500">' + esc(bi("الكمية المرفوضة (لا تدخل البيع) *", "Qté Rejetée QC *")) + '</label><input type="number" name="rejectedQty" min="0" value="0" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular font-bold text-red-500 min-h-[40px]" required /></div>';
        html += '</div>';
        html += '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">';
        html += '  <div><label class="block mb-1 font-semibold">' + esc(bi("نسبة الهدر الفعلي في القماش (%)", "Pourcentage de Perte Réelle (%)")) + '</label><input type="number" name="wastePercent" min="0" max="30" step="0.5" value="2" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular min-h-[40px]" /></div>';
        html += '  <div><label class="block mb-1 font-semibold">' + esc(bi("تكلفة المصنعية المباشرة للإجمالي (د.ج)", "Coût Main d'Œuvre Direct (DZD)")) + '</label><input type="number" name="directLaborCost" min="0" step="500" value="' + (po.directLaborCost || 6000) + '" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular min-h-[40px]" /></div>';
        html += '</div>';
        html += '<div class="p-3 rounded-lg surface-elevated space-y-1.5"><div class="font-semibold">' + esc(bi("قائمة فحص مراقبة الجودة (Contrôle Qualité):", "Liste de Vérification Contrôle Qualité :")) + '</div>';
        html += '  <label class="flex items-center gap-2"><input type="checkbox" checked required class="accent-[#C99A3D]" /><span>' + esc(bi("مطابقة المقاسات والقص والخياطة وتناظر التطريز الذهبي", "Conformité des mesures, coutures et broderie")) + '</span></label>';
        html += '</div>';
        html += '<div class="flex justify-end gap-2 pt-3 border-t border-[var(--border-color)]"><button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg surface-elevated min-h-[40px]">' + esc(bi("إلغاء", "Annuler")) + '</button><button type="submit" class="btn-gold px-5 py-2 rounded-lg font-bold min-h-[40px] flex items-center gap-1.5">' + lucideIcon("CheckCircle2", "w-4 h-4") + '<span>' + esc(bi("اعتماد الفحص وإدخال المقبول للمنتجات الجاهزة", "Valider QC & Entrer en Stock")) + '</span></button></div>';
        html += '</form>';

        openModal("مراقبة الجودة وإكمال أمر الإنتاج " + po.orderNumber, "Contrôle Qualité & Clôture " + po.orderNumber, html);
        var form = document.getElementById("modal-form-complete-po");
        if (form) {
          form.addEventListener("submit", function(e) {
            e.preventDefault();
            if (po.stockCompleted) {
              showToast("تم إكمال هذا الأمر مسبقاً (حماية عدم التكرار)", "Cet ordre a déjà été clôturé", "warning");
              return;
            }
            var fd = new FormData(form);
            var prodQ = parseInt(fd.get("producedQty"), 10) || 0;
            var accQ = parseInt(fd.get("acceptedQty"), 10) || 0;
            var rejQ = parseInt(fd.get("rejectedQty"), 10) || 0;
            var wastePct = parseFloat(fd.get("wastePercent")) || 0;
            var laborCost = roundMoney(parseFloat(fd.get("directLaborCost")) || 0);
            var todayIso = getAlgiersDateIso();

            if (accQ + rejQ !== prodQ || accQ <= 0) {
              showToast("يجب أن يساوي مجموع المقبول والمرفوض إجمالي المنتج وأن يكون المقبول أكبر من 0", "Accepté + Rejeté doit égaler Produit (> 0)", "error");
              return;
            }

            var actualMatCost = 0;
            if (mdl && mdl.bomItems) {
              for (var i = 0; i < mdl.bomItems.length; i++) {
                var b = mdl.bomItems[i];
                var mat = db.materials.find(function(x) { return x.id === b.materialId; });
                if (mat) {
                  var reservedForPo = po.materialsReserved ? roundQty(b.quantityPerUnit * po.requestedQty) : 0;
                  var consumedQ = roundQty(b.quantityPerUnit * prodQ * (1 + wastePct / 100));
                  mat.reservedQty = roundQty(Math.max(0, mat.reservedQty - reservedForPo));
                  mat.onHandQty = roundQty(Math.max(0, mat.onHandQty - consumedQ));
                  mat.availableQty = roundQty(Math.max(0, mat.onHandQty - mat.reservedQty));
                  var lineCost = roundMoney(consumedQ * mat.averageCost);
                  actualMatCost += lineCost;

                  db.materialStockMovements.push({
                    id: uid("msm"),
                    idempotencyKey: "issue-" + po.id + "-" + mat.id,
                    materialId: mat.id,
                    movementType: "PRODUCTION_ISSUE",
                    direction: "OUT",
                    quantity: consumedQ,
                    unitCost: mat.averageCost,
                    totalCost: lineCost,
                    balanceAfterOnHand: mat.onHandQty,
                    balanceAfterAvailable: mat.availableQty,
                    referenceType: "PRODUCTION_ORDER",
                    referenceId: po.orderNumber,
                    reason: "صرف فعلي لأمر الإنتاج " + po.orderNumber + " (شامل الهدر " + wastePct + "%)",
                    createdAt: todayIso + " 16:30"
                  });
                }
              }
            }

            actualMatCost = roundMoney(actualMatCost);
            var totalActualCost = roundMoney(actualMatCost + laborCost);
            var unitCost = roundMoney(totalActualCost / accQ);

            po.producedQty = prodQ;
            po.acceptedQty = accQ;
            po.rejectedQty = rejQ;
            po.materialsReserved = false;
            po.materialsIssued = true;
            po.stockCompleted = true;
            po.currentStageCode = "COMPLETED";
            po.status = "COMPLETED";
            po.actualMaterialCost = actualMatCost;
            po.directLaborCost = laborCost;
            po.actualTotalCost = totalActualCost;
            po.actualUnitCost = unitCost;
            po.completedAt = todayIso + " 16:30";

            var targetFp = db.finishedProducts.find(function(fp) {
              return fp.modelId === po.modelId && fp.color.toLowerCase() === po.color.toLowerCase() && fp.size.toLowerCase() === po.size.toLowerCase();
            });
            if (targetFp) {
              targetFp.unitProductionCost = calcMovingAverageCost(targetFp.onHandQty, targetFp.unitProductionCost, accQ, unitCost);
              targetFp.onHandQty += accQ;
              targetFp.availableQty = targetFp.onHandQty - targetFp.reservedQty;
            } else {
              var newSku = (mdl ? mdl.code.replace("MDL-", "PRD-") : "PRD-NEW") + "-" + po.color.slice(0, 3).toUpperCase() + "-" + po.size.toUpperCase();
              targetFp = {
                id: uid("fp"),
                sku: newSku,
                barcode: "613000" + Math.floor(1000000 + Math.random() * 8999999),
                modelId: po.modelId,
                categoryId: mdl ? mdl.categoryId : "cat-p-aby",
                nameAr: (mdl ? mdl.nameAr : "منتج") + " — " + po.color + " " + po.size,
                nameFr: (mdl ? mdl.nameFr : "Produit") + " — " + po.color + " " + po.size,
                color: po.color,
                size: po.size,
                onHandQty: accQ,
                reservedQty: 0,
                availableQty: accQ,
                minStockThreshold: 2,
                unitProductionCost: unitCost,
                sellingPrice: mdl ? mdl.defaultSellingPrice : roundMoney(unitCost * 1.8),
                images: mdl && mdl.images ? mdl.images : [getAssetSrc("asset-abaya-black")],
                status: "AVAILABLE"
              };
              db.finishedProducts.push(targetFp);
            }

            db.finishedStockMovements.push({
              id: uid("fsm"),
              idempotencyKey: "complete-" + po.id,
              finishedProductId: targetFp.id,
              movementType: "PRODUCTION_COMPLETION",
              direction: "IN",
              quantity: accQ,
              unitCost: unitCost,
              balanceAfter: targetFp.onHandQty,
              referenceType: "PRODUCTION_ORDER",
              referenceId: po.orderNumber,
              reason: "إدخال " + accQ + " قطع مقبولة من أمر الإنتاج " + po.orderNumber + " (المرفوض: " + rejQ + ")",
              createdAt: todayIso + " 16:30"
            });

            saveDatabase();
            closeModal();
            renderApp();
            showToast("تم إكمال الإنتاج وإدخال " + accQ + " قطع مقبولة إلى مخزون المنتجات الجاهزة", "Production terminée : " + accQ + " unités entrées en stock produits finis", "success");
          });
        }
      }

      // --- WORKFLOW C: Complete POS Sale ---
      function completePosSale() {
        if (uiState.posCart.length === 0) {
          showToast("السلة فارغة — أضف منتجاً واحداً على الأقل", "Le panier est vide", "warning");
          return;
        }
        var cust = db.customers.find(function(c) { return c.id === uiState.posCustomerId; }) || db.customers[0];
        var todayIso = getAlgiersDateIso();

        for (var i = 0; i < uiState.posCart.length; i++) {
          var ci = uiState.posCart[i];
          var fp = db.finishedProducts.find(function(x) { return x.id === ci.finishedProductId; });
          if (!fp) continue;
          if (db.settings.preventNegativeStock && ci.quantity > fp.availableQty) {
            showToast("الكمية المطلوبة من " + bi(fp.nameAr, fp.nameFr) + " تتجاوز المتاح (" + fp.availableQty + ")", "Stock disponible insuffisant pour " + fp.nameFr, "error");
            return;
          }
        }

        var subtotal = 0, lineDiscTotal = 0, totalCogs = 0;
        var saleItems = [], invoiceItems = [];

        var seq = db.settings.nextInvoiceSequence || (1001 + db.invoices.length);
        db.settings.nextInvoiceSequence = seq + 1;
        var invNum = (db.settings.invoicePrefix || "FAC-2026-") + seq;
        var saleNum = "VTE-2026-" + seq;
        var newSaleId = uid("sal");
        var newInvId = uid("inv");

        for (var j = 0; j < uiState.posCart.length; j++) {
          var item = uiState.posCart[j];
          var prod = db.finishedProducts.find(function(x) { return x.id === item.finishedProductId; });
          if (!prod) continue;
          var lDisc = roundMoney(item.lineDiscount || 0);
          var lTot = roundMoney(Math.max(0, prod.sellingPrice * item.quantity - lDisc));
          subtotal += roundMoney(prod.sellingPrice * item.quantity);
          lineDiscTotal += lDisc;
          totalCogs += roundMoney(prod.unitProductionCost * item.quantity);

          prod.onHandQty = Math.max(0, prod.onHandQty - item.quantity);
          prod.availableQty = Math.max(0, prod.onHandQty - prod.reservedQty);

          db.finishedStockMovements.push({
            id: uid("fsm"),
            idempotencyKey: "sale-" + newSaleId + "-" + prod.id,
            finishedProductId: prod.id,
            movementType: "SALE_DISPATCH",
            direction: "OUT",
            quantity: item.quantity,
            unitCost: prod.unitProductionCost,
            balanceAfter: prod.onHandQty,
            referenceType: "SALE",
            referenceId: saleNum,
            reason: "بيع نقطة البيع فاتورة " + invNum,
            createdAt: todayIso + " 17:15"
          });

          saleItems.push({
            finishedProductId: prod.id,
            skuSnapshot: prod.sku,
            nameArSnapshot: prod.nameAr,
            nameFrSnapshot: prod.nameFr,
            colorSnapshot: prod.color,
            sizeSnapshot: prod.size,
            quantity: item.quantity,
            returnedQty: 0,
            unitPrice: prod.sellingPrice,
            unitCostSnapshot: prod.unitProductionCost,
            lineDiscount: lDisc,
            lineTotal: lTot
          });

          invoiceItems.push({
            lineNumber: j + 1,
            skuSnapshot: prod.sku,
            descriptionArSnapshot: prod.nameAr,
            descriptionFrSnapshot: prod.nameFr,
            colorSnapshot: prod.color,
            sizeSnapshot: prod.size,
            quantity: item.quantity,
            unitPrice: prod.sellingPrice,
            lineDiscount: lDisc,
            lineTotal: lTot
          });
        }

        var ordDisc = roundMoney(uiState.posOrderDiscount || 0);
        var totalDisc = roundMoney(lineDiscTotal + ordDisc);
        var netSub = roundMoney(Math.max(0, subtotal - totalDisc));
        var taxAmt = db.settings.taxEnabled ? roundMoney(netSub * (db.settings.defaultTaxRate / 100)) : 0;
        var grandTotal = roundMoney(netSub + taxAmt);
        var paidNow = roundMoney(Math.min(grandTotal, Math.max(0, uiState.posAmountReceived || 0)));

        db.sales.unshift({
          id: newSaleId,
          idempotencyKey: uid("idem-sale"),
          saleNumber: saleNum,
          invoiceId: newInvId,
          customerId: cust.id,
          saleDate: todayIso,
          status: "CONFIRMED",
          subtotal: roundMoney(subtotal),
          lineDiscountTotal: lineDiscTotal,
          orderDiscountAmount: ordDisc,
          taxAmount: taxAmt,
          totalAmount: grandTotal,
          totalCogs: roundMoney(totalCogs),
          notes: "بيع نقطة البيع POS",
          items: saleItems
        });

        var newInvoice = {
          id: newInvId,
          invoiceNumber: invNum,
          saleId: newSaleId,
          customerId: cust.id,
          documentStatus: "ISSUED",

        html += '  <div><label class="block mb-1 font-semibold text-red-500">' + esc(bi("المبلغ المسترد للعميل (د.ج) *", "Montant à Rembourser (DZD) *")) + '</label><input type="number" name="amount" min="1" max="' + targetInv.netPaidAmount + '" step="500" value="' + Math.min(24500, targetInv.netPaidAmount) + '" class="w-full px-3 py-2 rounded-lg surface-elevated num-tabular font-bold text-red-500 min-h-[40px]" required /></div>';

        html += '<div class="flex justify-end gap-2 pt-3 border-t border-[var(--border-color)]"><button type="button" data-action="close-modal" class="px-4 py-2 rounded-lg surface-elevated min-h-[40px]">' + esc(bi("إلغاء", "Annuler")) + '</button><button type="submit" class="btn-gold px-5 py-2 rounded-lg font-bold min-h-[40px]">' + esc(bi("اعتماد الاسترداد وتحديث المخزون والحسابات", "Valider le Retour & Remboursement")) + '</button></div>';
        html += '</form>';

        openModal("تسجيل مرتجع مبيعات واسترداد مالي موثق", "Enregistrer un Retour Marchandise & Remboursement", html);
        var form = document.getElementById("modal-form-rec-refund");
        if (form) {
          form.addEventListener("submit", function(e) {
            e.preventDefault();
            var fd = new FormData(form);
            var invObj = db.invoices.find(function(x) { return x.id === fd.get("invoiceId"); });
            var retQ = Math.max(0, parseInt(fd.get("returnedQuantity"), 10) || 0);
            var cond = String(fd.get("returnCondition") || "RESTOCK");
            var amt = roundMoney(parseFloat(fd.get("amount")) || 0);
            var rm = String(fd.get("refundMethod") || "CASH");
            var reason = String(fd.get("reason") || "").trim();
            var todayIso = getAlgiersDateIso();

            if (!invObj || amt <= 0 || amt > invObj.netPaidAmount) {
              showToast("المبلغ المسترد يتجاوز صافي المدفوع في الفاتورة", "Montant supérieur au net payé", "error");
              return;
            }

            var saleObj = db.sales.find(function(s) { return s.id === invObj.saleId; });
            var fpId = null;
            if (saleObj && saleObj.items && saleObj.items[0]) {
              fpId = saleObj.items[0].finishedProductId;
              saleObj.items[0].returnedQty = (saleObj.items[0].returnedQty || 0) + retQ;
              saleObj.status = amt >= invObj.totalAmount ? "RETURNED" : "PARTIALLY_RETURNED";
              if (cond === "RESTOCK" && retQ > 0) {
                var cogsReduction = roundMoney(retQ * saleObj.items[0].unitCostSnapshot);
                saleObj.totalCogs = roundMoney(Math.max(0, saleObj.totalCogs - cogsReduction));
              }
            }

            var refNum = "AVO-2026-" + String(db.refunds.length + 101);
            if (cond === "RESTOCK" && retQ > 0 && fpId) {
              var fp = db.finishedProducts.find(function(x) { return x.id === fpId; });
              if (fp) {
                fp.onHandQty += retQ;
                fp.availableQty = fp.onHandQty - fp.reservedQty;
                db.finishedStockMovements.push({
                  id: uid("fsm"),
                  idempotencyKey: "ref-stock-" + refNum,
                  finishedProductId: fp.id,
                  movementType: "CUSTOMER_RETURN_RESTOCK",
                  direction: "IN",
                  quantity: retQ,
                  unitCost: fp.unitProductionCost,
                  balanceAfter: fp.onHandQty,
                  referenceType: "REFUND",
                  referenceId: refNum,
                  reason: "إرجاع عميل بحالة سليمة (" + reason + ")",
                  createdAt: todayIso + " 18:10"
                });
              }
            }

            db.refunds.push({
              id: uid("ref"),
              idempotencyKey: uid("idem-ref"),
              refundReference: refNum,
              saleId: invObj.saleId,
              invoiceId: invObj.id,
              customerId: invObj.customerId,
              finishedProductId: fpId,
              returnedQuantity: retQ,
              returnCondition: cond,
              amount: amt,
              refundMethod: rm,
              reason: reason,
              refundDate: todayIso
            });

            recordCashMovement("OUT", "CUSTOMER_REFUND", amt, rm, "REFUND", refNum, "استرداد مالي للعميل — " + invObj.invoiceNumber, todayIso);
            saveDatabase();
            closeModal();
            renderApp();
            showToast("تم تسجيل الاسترداد " + refNum + " وتحديث حالة الفاتورة والمخزون", "Remboursement " + refNum + " enregistré", "success");
          });
        }
      }
