      // Real Binary PDF Export via html2pdf.js (Fixes Issue #7)
      function downloadInvoiceRealPdf(invId) {
        var inv = db.invoices.find(function(x) { return x.id === invId; });
        if (!inv) return;
        var el = document.getElementById("invoice-print-container");
        if (!el) return;

        if (typeof window.html2pdf === "function") {
          var isThermal = uiState.activeInvoicePrintFormat === "THERMAL80";
          var opt = {
            margin: isThermal ? 2 : 8,
            filename: inv.invoiceNumber + ".pdf",
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: "#FFFFFF" },
            jsPDF: isThermal
              ? { unit: "mm", format: [80, 200], orientation: "portrait" }
              : { unit: "mm", format: "a4", orientation: "portrait" }
          };
          showToast("جاري توليد ملف PDF للفاتورة " + inv.invoiceNumber + "...", "Génération du fichier PDF " + inv.invoiceNumber + "...", "success");
          window.html2pdf().set(opt).from(el).save();
        } else {
          window.print();
        }
      }

      // =========================================================================
      // 22. CSV & JSON BACKUP EXPORTERS
      // =========================================================================
      function downloadFileBlob(filename, content, mimeType) {
        var blob = new Blob([content], { type: mimeType || "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function() {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 200);
      }

      function exportCsvReport(reportType) {
        var rows = [];
        var todayIso = getAlgiersDateIso();
        if (reportType === "inventory_valuation") {
          rows.push(["SKU", "Name_AR", "Name_FR", "Unit", "OnHand_Qty", "Reserved_Qty", "Available_Qty", "CMP_DZD", "Total_Value_DZD"]);
          for (var i = 0; i < db.materials.length; i++) {
            var m = db.materials[i];
            rows.push([m.sku, m.nameAr, m.nameFr, m.unit, m.onHandQty, m.reservedQty, m.availableQty, m.averageCost, roundMoney(m.onHandQty * m.averageCost)]);
          }
        } else {
          rows.push(["Invoice_Number", "Issue_Date", "Due_Date", "Customer", "Total_DZD", "Net_Paid_DZD", "Remaining_DZD", "Payment_Status"]);
          for (var j = 0; j < db.invoices.length; j++) {
            var inv = db.invoices[j];
            rows.push([inv.invoiceNumber, inv.issueDate, inv.dueDate, inv.customerSnapshot.fullName, inv.totalAmount, inv.netPaidAmount, inv.remainingBalance, inv.paymentStatus]);
          }
        }
        var csv = "\uFEFF" + rows.map(function(r) {
          return r.map(function(cell) { return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(",");
        }).join("\n");
        downloadFileBlob("atelier_os_" + reportType + "_" + todayIso + ".csv", csv, "text/csv;charset=utf-8");
        showToast("تم تصدير ملف CSV بنجاح", "Fichier CSV exporté avec succès", "success");
      }

      // =========================================================================
      // 23. GLOBAL EVENT DELEGATION, HASH ROUTING & INITIALIZATION
      // =========================================================================
      function navigateToModule(modId) {
        ensureEnterpriseRbacState();
        var reqPerm = MODULE_REQUIRED_PERMISSION[modId];
        if (reqPerm && !hasPermission(reqPerm)) {
          showToast("عذراً، دورك الوظيفي الحالي لا يملك صلاحية الوصول لهذا القسم (" + reqPerm + ")", "Accès restreint: permission requise (" + reqPerm + ")", "error");
          return;
        }
        uiState.activeModule = modId || "dashboard";
        try {
          window.history.replaceState(null, "", "#/" + uiState.activeModule);
        } catch (e) {}
        var sb = document.getElementById("app-sidebar");
        var bd = document.getElementById("mobile-sidebar-backdrop");
        if (sb && bd) {
          sb.classList.add("-translate-x-full", "rtl:translate-x-full");
          bd.classList.add("hidden");
        }
        renderApp();
      }

      document.addEventListener("click", function(e) {
        var btn = e.target.closest("[data-action]");
        if (!btn) return;
        var action = btn.getAttribute("data-action");

        if (action === "nav-module") {
          navigateToModule(btn.getAttribute("data-module") || "dashboard");
        } else if (action === "open-mobile-sidebar") {
          var sbOpen = document.getElementById("app-sidebar");
          var bdOpen = document.getElementById("mobile-sidebar-backdrop");
          if (sbOpen && bdOpen) {
            sbOpen.classList.remove("-translate-x-full", "rtl:translate-x-full");
            bdOpen.classList.remove("hidden");
          }
        } else if (action === "close-mobile-sidebar") {
          var sbClose = document.getElementById("app-sidebar");
          var bdClose = document.getElementById("mobile-sidebar-backdrop");
          if (sbClose && bdClose) {
            sbClose.classList.add("-translate-x-full", "rtl:translate-x-full");
            bdClose.classList.add("hidden");
          }
        } else if (action === "set-lang") {
          uiState.lang = btn.getAttribute("data-lang") || "ar";
          renderApp();
        } else if (action === "toggle-theme") {
          uiState.theme = uiState.theme === "dark" ? "light" : "dark";
          renderApp();
        } else if (action === "close-modal") {
          closeModal();
        } else if (action === "set-dashboard-period") {
          uiState.dashboardPeriod = btn.getAttribute("data-period") || "ALL";
          renderApp();
        } else if (action === "set-inventory-subtab") {
          uiState.inventorySubTab = btn.getAttribute("data-subtab") || "catalog";
          renderApp();
        } else if (action === "set-inv-view") {
          uiState.inventoryViewMode = btn.getAttribute("data-view") || "table";
          renderApp();
        } else if (action === "set-prod-view") {
          uiState.productionViewMode = btn.getAttribute("data-view") || "kanban";
          renderApp();
        } else if (action === "set-pos-cat") {
          uiState.posCategoryFilter = btn.getAttribute("data-cat") || "ALL";
          renderApp();
        } else if (action === "pos-scroll-to-cart") {
          var cartSec = document.getElementById("pos-cart-section");
          if (cartSec) cartSec.scrollIntoView({ behavior: "smooth" });
        } else if (action === "pos-add-item" || action === "pos-quick-add") {
          var fpId = btn.getAttribute("data-id");
          var fp = db.finishedProducts.find(function(x) { return x.id === fpId; });
          if (!fp) return;
          var existing = uiState.posCart.find(function(c) { return c.finishedProductId === fpId; });
          if (existing) {
            if (db.settings.preventNegativeStock && existing.quantity + 1 > fp.availableQty) {
              showToast("الكمية المتاحة في المخزون: " + fp.availableQty, "Stock maximum disponible atteint", "warning");
              return;
            }
            existing.quantity += 1;
          } else {
            if (db.settings.preventNegativeStock && fp.availableQty < 1) {
              showToast("المنتج غير متوفر في المخزون", "Produit en rupture de stock", "error");
              return;
            }
            uiState.posCart.push({ finishedProductId: fpId, quantity: 1, lineDiscount: 0 });
          }
          var tot = 0;
          for (var cIdx = 0; cIdx < uiState.posCart.length; cIdx++) {
            var pObj = db.finishedProducts.find(function(x) { return x.id === uiState.posCart[cIdx].finishedProductId; });
            if (pObj) tot += pObj.sellingPrice * uiState.posCart[cIdx].quantity - (uiState.posCart[cIdx].lineDiscount || 0);
          }
          uiState.posAmountReceived = Math.max(0, tot - (uiState.posOrderDiscount || 0));
          navigateToModule("pos");
        } else if (action === "pos-qty-delta") {
          var idx = parseInt(btn.getAttribute("data-index"), 10);
          var delta = parseInt(btn.getAttribute("data-delta"), 10);
          var cartItem = uiState.posCart[idx];
          if (cartItem) {
            var prodObj = db.finishedProducts.find(function(x) { return x.id === cartItem.finishedProductId; });
            var nextQ = cartItem.quantity + delta;
            if (nextQ <= 0) {
              uiState.posCart.splice(idx, 1);
            } else if (prodObj && db.settings.preventNegativeStock && nextQ > prodObj.availableQty) {
              showToast("الحد الأقصى المتاح: " + prodObj.availableQty, "Stock maximum atteint", "warning");
            } else {
              cartItem.quantity = nextQ;
            }
            renderApp();
          }
        } else if (action === "pos-remove-item") {
          var rIdx = parseInt(btn.getAttribute("data-index"), 10);
          uiState.posCart.splice(rIdx, 1);
          renderApp();
        } else if (action === "pos-clear-cart") {
          uiState.posCart = [];
          uiState.posAmountReceived = 0;
          renderApp();
        } else if (action === "pos-complete-sale") {
          completePosSale();
        } else if (action === "open-add-material-modal") {
          openAddMaterialModal();
        } else if (action === "open-edit-material-modal") {
          openEditMaterialModal(btn.getAttribute("data-id"));
        } else if (action === "open-material-detail") {
          openMaterialDetailModal(btn.getAttribute("data-id"));
        } else if (action === "open-stock-adjustment-modal") {
          openStockAdjustmentModal(btn.getAttribute("data-material-id"));
        } else if (action === "open-add-purchase-modal") {
          openAddPurchaseModal();
        } else if (action === "receive-purchase") {
          var purId = btn.getAttribute("data-id");
          var pur = db.purchases.find(function(x) { return x.id === purId; });
          if (pur && pur.receiptStatus !== "RECEIVED") {
            pur.receiptStatus = "RECEIVED";
            for (var pi = 0; pi < (pur.items || []).length; pi++) {
              var it = pur.items[pi];
              var deltaQ = roundQty(Math.max(0, it.orderedQty - (it.receivedQty || 0)));
              if (deltaQ > 0) {
                it.receivedQty = it.orderedQty;
                var mat = db.materials.find(function(m) { return m.id === it.materialId; });
                if (mat) {
                  mat.averageCost = calcMovingAverageCost(mat.onHandQty, mat.averageCost, deltaQ, it.unitPrice);
                  mat.onHandQty = roundQty(mat.onHandQty + deltaQ);
                  mat.availableQty = roundQty(Math.max(0, mat.onHandQty - mat.reservedQty));
                  db.materialStockMovements.push({
                    id: uid("msm"),
                    idempotencyKey: "rec-" + pur.id + "-" + mat.id,
                    materialId: mat.id,
                    movementType: "PURCHASE_RECEIPT",
                    direction: "IN",
                    quantity: deltaQ,
                    unitCost: it.unitPrice,
                    totalCost: roundMoney(deltaQ * it.unitPrice),
                    balanceAfterOnHand: mat.onHandQty,
                    balanceAfterAvailable: mat.availableQty,
                    referenceType: "PURCHASE",
                    referenceId: pur.purchaseNumber,
                    reason: "تأكيد استلام المشتريات " + pur.purchaseNumber,
                    createdAt: getAlgiersDateIso() + " 16:00"
                  });
                }
              }
            }
            saveDatabase();
            renderApp();
            showToast("تم تأكيد استلام المشتريات وتحديث المخزون", "Réception d'achat confirmée", "success");
          }
        } else if (action === "open-add-supplier-modal") {
          openAddSupplierModal();
        } else if (action === "open-supplier-payment-modal") {
          openSupplierPaymentModal(btn.getAttribute("data-supplier-id"), btn.getAttribute("data-purchase-id"));
        } else if (action === "open-auth-modal") {
          openAuthSwitcherModal();
        } else if (action === "open-create-employee") {
          openCreateEmployeeModal();
        } else if (action === "open-emp-permissions") {
          openEmployeePermissionsModal(btn.getAttribute("data-emp-id"));
        } else if (action === "open-model-gallery") {
          openModelGalleryModal(btn.getAttribute("data-model-id"));
        } else if (action === "switch-user-account") {
          var targetEmpId = btn.getAttribute("data-emp-id");
          var targetEmp = (db.employees || []).find(function(e) { return e.id === targetEmpId; });
          if (targetEmp) {
            if (!targetEmp.isActive) {
              showToast("هذا الحساب موقوف من طرف الإدارة", "Ce compte employé est suspendu", "error");
              return;
            }
            db.currentUserId = targetEmp.id;
            logActivity("AUTH_SWITCH", "PROFILE", targetEmp.id, "تبديل الجلسة النشطة إلى حساب: " + targetEmp.username, "Session active basculée vers: " + targetEmp.username);
            saveDatabase();
            closeModal();
            var reqP = MODULE_REQUIRED_PERMISSION[uiState.activeModule];
            if (reqP && !hasPermission(reqP)) {
              uiState.activeModule = "dashboard";
            }
            renderApp();
            showToast("تم الدخول بحساب: " + targetEmp.fullName + " (" + targetEmp.roleCode + ")", "Connecté en tant que: " + targetEmp.fullName, "success");
          }
        } else if (action === "toggle-emp-active") {
          var empId = btn.getAttribute("data-emp-id");
          var empObj = (db.employees || []).find(function(e) { return e.id === empId; });
          if (empObj && empObj.accountType !== "OWNER") {
            empObj.isActive = !empObj.isActive;
            empObj.sessionVersion = (empObj.sessionVersion || 1) + 1;
            logActivity(empObj.isActive ? "EMPLOYEE_REACTIVATED" : "EMPLOYEE_DEACTIVATED", "PROFILE", empObj.id, (empObj.isActive ? "إعادة تفعيل حساب الموظف " : "تعطيل حساب وإلغاء جلسات الموظف ") + empObj.username, "Changement statut employé: " + empObj.username);
            saveDatabase();
            renderApp();
            showToast(empObj.isActive ? "تم تفعيل الحساب" : "تم تعطيل الحساب وإلغاء جلساته النشطة", "Statut du compte mis à jour", "info");
          }
        } else if (action === "open-add-model-modal") {
          openAddModelModal();
        } else if (action === "open-add-production-modal") {
          openAddProductionModal(btn.getAttribute("data-model-id"));
        } else if (action === "advance-production-stage") {
          advanceProductionStage(btn.getAttribute("data-id"));
        } else if (action === "cancel-production-order") {
          cancelProductionOrder(btn.getAttribute("data-id"));
        } else if (action === "open-complete-production-modal") {
          openCompleteProductionModal(btn.getAttribute("data-id"));
        } else if (action === "open-add-finished-modal") {
          openAddFinishedProductModal();
        } else if (action === "open-invoice-modal") {
          openInvoicePrintModal(btn.getAttribute("data-id"));
        } else if (action === "set-inv-print-fmt") {
          uiState.activeInvoicePrintFormat = btn.getAttribute("data-fmt") || "A4";
          openInvoicePrintModal(btn.getAttribute("data-id"));
        } else if (action === "set-inv-print-lang") {
          uiState.activeInvoicePrintLang = btn.getAttribute("data-plang") || "bilingual";
          openInvoicePrintModal(btn.getAttribute("data-id"));
        } else if (action === "trigger-browser-print" || action === "print-current-page") {
          window.print();
        } else if (action === "download-invoice-pdf") {
          downloadInvoiceRealPdf(btn.getAttribute("data-id"));
        } else if (action === "open-record-payment-modal") {
          openRecordPaymentModal(btn.getAttribute("data-invoice-id"));
        } else if (action === "open-record-refund-modal") {
          openRecordRefundModal(btn.getAttribute("data-invoice-id"));
        } else if (action === "open-add-customer-modal") {
          openAddCustomerModal();
        } else if (action === "open-customer-detail-modal") {
          openCustomerDetailModal(btn.getAttribute("data-id"));
        } else if (action === "open-add-expense-modal") {
          openAddExpenseModal();
        } else if (action === "set-report-tab") {
          uiState.activeReportTab = btn.getAttribute("data-tab") || "sales_summary";
          renderApp();
        } else if (action === "export-csv") {
          exportCsvReport(btn.getAttribute("data-report") || "invoices");
        } else if (action === "export-backup-json") {
          var todayIso = getAlgiersDateIso();
          db.settings.lastBackupAt = todayIso + " " + new Date().toTimeString().slice(0, 5);
          saveDatabase();
          downloadFileBlob("atelier_os_backup_" + todayIso + ".json", JSON.stringify(db, null, 2), "application/json");
          renderApp();
          showToast("تم تصدير النسخة الاحتياطية الكاملة بنجاح", "Sauvegarde JSON complète exportée", "success");
        } else if (action === "reset-demo-data") {
          db = buildInitialDatabase();
          saveDatabase();
          renderApp();
          showToast("تمت إعادة ضبط البيانات النموذجية لدار عفاف الأصلي", "Données de démonstration réinitialisées", "success");
        }
      });

      // Global Search bar handler
      var gSearch = document.getElementById("global-search-input");
      var gDrop = document.getElementById("global-search-dropdown");
      if (gSearch && gDrop) {
        gSearch.addEventListener("input", function(e) {
          var q = (e.target.value || "").trim().toLowerCase();
          if (!q) {
            gDrop.classList.add("hidden");
            return;
          }
          var hits = [];
          for (var i = 0; i < db.materials.length; i++) {
            var m = db.materials[i];
            if (m.sku.toLowerCase().indexOf(q) !== -1 || m.nameAr.toLowerCase().indexOf(q) !== -1 || m.nameFr.toLowerCase().indexOf(q) !== -1) {
              hits.push({ label: bi(m.nameAr, m.nameFr) + " (" + m.sku + ")", mod: "inventory" });
            }
          }
          for (var j = 0; j < db.finishedProducts.length; j++) {
            var fp = db.finishedProducts[j];
            if (fp.sku.toLowerCase().indexOf(q) !== -1 || fp.nameAr.toLowerCase().indexOf(q) !== -1 || fp.nameFr.toLowerCase().indexOf(q) !== -1) {
              hits.push({ label: bi(fp.nameAr, fp.nameFr) + " (" + fp.sku + ")", mod: "finished" });
            }
          }
          for (var k = 0; k < db.invoices.length; k++) {
            var inv = db.invoices[k];
            if (inv.invoiceNumber.toLowerCase().indexOf(q) !== -1 || inv.customerSnapshot.fullName.toLowerCase().indexOf(q) !== -1) {
              hits.push({ label: inv.invoiceNumber + " — " + inv.customerSnapshot.fullName, mod: "invoices" });
            }
          }
          if (hits.length === 0) {
            gDrop.innerHTML = '<div class="p-2 text-[var(--text-muted)]">' + esc(bi("لا توجد نتائج مطابقة", "Aucun résultat")) + '</div>';
          } else {
            gDrop.innerHTML = hits.slice(0, 8).map(function(h) {
              return '<button type="button" data-action="nav-module" data-module="' + h.mod + '" class="w-full text-start p-2 rounded hover:bg-[#C99A3D]/15 block truncate">' + esc(h.label) + '</button>';
            }).join("");
          }
          gDrop.classList.remove("hidden");
        });
        document.addEventListener("click", function(ev) {
          if (!ev.target.closest("#global-search-input") && !ev.target.closest("#global-search-dropdown")) {
            gDrop.classList.add("hidden");
          }
        });
      }

      // Restore active module from URL hash on page refresh
      function syncFromHash() {
        var h = (window.location.hash || "").replace(/^#\/?/, "").trim();
        if (h && MODULES.some(function(m) { return m.id === h; })) {
          uiState.activeModule = h;
        }
      }

      window.addEventListener("hashchange", function() {
        
        syncFromHash();
        renderApp();
      });

      // React Bits SpotlightCard & GSAP-grade Coordinated Entrance Hook
      document.addEventListener("mousemove", function(e) {
        var card = e.target && e.target.closest ? e.target.closest(".surface-card") : null;
        if (!card) return;
        if (!card.classList.contains("rb-spotlight-card")) {
          card.classList.add("rb-spotlight-card");
        }
        var rect = card.getBoundingClientRect();
        card.style.setProperty("--spot-x", (e.clientX - rect.left) + "px");
        card.style.setProperty("--spot-y", (e.clientY - rect.top) + "px");
        card.style.setProperty("--spot-opacity", "1");
      }, { passive: true });

      window.addEventListener("DOMContentLoaded", function() {
        loadDatabase();
        syncFromHash();
        renderApp();
      });
    })();
  </script>
</body>
</html>
